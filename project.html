<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FBFCFB; --ink:#14302A; --muted:#5B706A; --line:#D3DDD8; --soft:#E1EAE6;
  --brand:#1B6B5A; --brand-ink:#FFFFFF; --ok:#2E8B57; --warn:#B87A00; --over:#C93A2E; --accent:#D99A12;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#16251F; --ink:#E4EEEA; --muted:#93A8A1; --line:#26382F; --soft:#1D2F28;
    --brand:#4FB59C; --brand-ink:#0B1411; --ok:#58C08A; --warn:#E4B23C; --over:#EF6B5E; --accent:#E8B84A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16251F; --ink:#E4EEEA; --muted:#93A8A1; --line:#26382F; --soft:#1D2F28;
  --brand:#4FB59C; --brand-ink:#0B1411; --ok:#58C08A; --warn:#E4B23C; --over:#EF6B5E; --accent:#E8B84A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-0.01em;line-height:1.15}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.15rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.35rem;padding:0 10px 18px}
.brand svg{width:30px;height:30px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.navbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navbtn:hover{background:var(--soft);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.acct{margin-top:auto;display:grid;gap:10px;padding:14px 10px 0;border-top:1px solid var(--line)}
.acct b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .row2{display:flex;gap:8px;align-items:center}
.topbar{display:none}
.main{padding:28px clamp(16px,3.5vw,44px) 56px;max-width:1180px;width:100%;outline:none}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}
.mnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.mnav span{min-width:128px;text-align:center;font-weight:600}
.icon{width:34px;height:34px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:1.2rem;line-height:1}
.icon:hover{background:var(--soft)}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel>h2{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.link{background:none;border:0;padding:4px 6px;cursor:pointer;color:var(--brand);font-weight:600;font-size:.9rem}
.link:hover{text-decoration:underline}
.link.danger{color:var(--over)}
.field{display:grid;gap:5px;margin-bottom:14px}
.field>label,.field>legend{font-weight:600;font-size:.92rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input::placeholder{color:var(--muted);opacity:.8}
.err{color:var(--over);font-size:.86rem;min-height:0}
.err:empty{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{display:block;text-align:center;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{display:block;margin:-8px;padding:8px;border-radius:7px;background:var(--brand);color:var(--brand-ink)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:.9rem}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--ink)}
.chip.over{background:color-mix(in srgb,var(--over) 18%,var(--surface));color:var(--ink)}

/* hero pace */
.hero{padding:26px clamp(18px,3vw,32px) 30px}
.hero .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2.4rem,7vw,4.2rem);letter-spacing:-0.03em;line-height:1}
.hero .big.over{color:var(--over)}
.hero .sub{margin-top:8px;color:var(--muted)}
.pace{position:relative;margin:34px 0 36px}
.pace-track{height:26px;border-radius:8px;background:var(--soft);overflow:hidden}
.pace-fill{height:100%;width:0;border-radius:8px 0 0 8px;background:var(--brand);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.pace-fill.warn{background:var(--warn)}
.pace-fill.over{background:var(--over)}
.pace-mark{position:absolute;top:-8px;bottom:-8px;width:0;border-left:2px dashed var(--ink)}
.pace-mark span{position:absolute;top:100%;left:0;transform:translateX(-50%);margin-top:4px;font-size:.82rem;color:var(--muted);white-space:nowrap;background:var(--surface);padding:0 4px}
.pace-msg{font-size:1.02rem;max-width:62ch}
.empty{padding:6px 0;color:var(--muted)}
.empty .btn{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0}
.stats>div{padding:6px 20px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:4px}
.stats small{display:block;color:var(--muted)}
.stats b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.55rem;font-weight:600}
.stats b.neg{color:var(--over)}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chartbox{position:relative;height:270px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{color:var(--muted);font-size:.9rem}
.row .m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.row .m small{color:var(--muted);flex-basis:100%;padding-left:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.amt.in{color:var(--ok)}
.acts{display:flex;gap:2px}
.toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:10px}
.listfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--muted);font-size:.92rem}
.sticky{position:sticky;top:16px}
.txgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}

/* budgets */
.brow{display:grid;grid-template-columns:150px 140px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar.warn i{background:var(--warn)}
.bar.over i{background:var(--over)}
.bl{display:block;margin-top:5px;font-size:.88rem;color:var(--muted)}
.bl.warn{color:var(--warn)}
.bl.over{color:var(--over);font-weight:600}
.prefix{position:relative}
.prefix>b{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500}
.prefix input{padding-left:28px}

/* groups */
.ggrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.glist{display:grid;gap:6px;margin-bottom:16px}
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;font-weight:600}
.gbtn[aria-current="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--brand)}
.bal{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.bal:first-of-type{border-top:0}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--over);font-weight:600}
.settle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.settle:first-of-type{border-top:0}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* auth */
.authwrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.authhero{padding:clamp(28px,6vw,72px);background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.authhero .brand{padding:0;color:inherit}
.authhero h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;letter-spacing:-0.03em;max-width:14ch}
.authhero p{max-width:40ch;opacity:.9;margin-top:16px;font-size:1.05rem}
.authform{display:flex;align-items:center;justify-content:center;padding:28px 18px}
.authform .panel{width:100%;max-width:400px;padding:26px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:3px;border-radius:10px;margin-bottom:20px;border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.note{font-size:.85rem;color:var(--muted);margin-top:14px}

/* overlays */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:50;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{width:100%;max-width:640px;max-height:86vh;overflow:auto}
.modal textarea{width:100%;min-height:240px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}

@media (max-width:980px){
  .two,.txgrid,.ggrid{grid-template-columns:1fr}
  .sticky{position:static}
}
@media (max-width:820px){
  .shell{display:block}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30}
  .side .brand,.side .acct{display:none}
  .navbtn{flex-direction:column;gap:2px;justify-content:center;align-items:center;font-size:.72rem;padding:7px 4px;text-align:center}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 0}
  .topbar .brand{padding:0;font-size:1.2rem}
  .topbar .row2{display:flex;gap:8px;align-items:center}
  .main{padding-bottom:110px}
  .authwrap{grid-template-columns:1fr}
  .authhero{padding-bottom:32px}
  .brow{grid-template-columns:1fr 130px}
  .brow>div:last-child{grid-column:1 / -1}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar input{grid-column:1 / -1}
}
@media (max-width:520px){
  .stats b{font-size:1.2rem}
  .stats>div{padding:6px 10px}
  .formrow{grid-template-columns:1fr}
  .row{grid-template-columns:48px minmax(0,1fr) auto}
  .row .acts{grid-column:2 / -1;justify-content:flex-start}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  .pace-fill,#toast{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modalroot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- storage (localStorage with in-memory fallback) ---------- */
var Store={
  mem:{},
  get:function(k){
    if(Object.prototype.hasOwnProperty.call(this.mem,k))return this.mem[k];
    try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}
  },
  set:function(k,v){
    this.mem[k]=v;
    try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  }
};

/* ---------- helpers ---------- */
var app=document.getElementById('app');
var pad=function(n){return String(n).padStart(2,'0')};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)};
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(s){return s.slice(0,7)}
function monthLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleString('en',{month:'long',year:'numeric'})}
function monthShort(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleString('en',{month:'short'})}
function shiftMonth(m,d){var p=m.split('-').map(Number);var dt=new Date(p[0],p[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
function daysIn(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function fmtDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en',{day:'numeric',month:'short'})}
function fmt(n){
  var sym=S.data?S.data.currency:'₹';
  var loc=sym==='₹'?'en-IN':'en-US';
  var v=Math.abs(n);
  return (n<0?'−':'')+sym+v.toLocaleString(loc,{minimumFractionDigits:0,maximumFractionDigits:2});
}
function sum(arr){return arr.reduce(function(a,t){return a+t.amount},0)}

var EXP_CATS=['Food','Commute','Rent','Shopping','Bills','Health','Fun','Education','Other'];
var INC_CATS=['Allowance','Salary','Freelance','Gift','Other income'];
var CAT_COLORS={Food:'#E07A3F',Commute:'#3F8FD9',Rent:'#7A5CC7',Shopping:'#D9577F',Bills:'#3BA39A',Health:'#C4453B',Fun:'#D9A91F',Education:'#5A7D3A',Other:'#8A97A0'};
var CURRENCIES=['₹','$','€','£'];

var ICONS={
  dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  transactions:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  budgets:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/></svg>',
  groups:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg>'
};
var BRAND_SVG='<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor" opacity=".16"/><path d="M8 21l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="9" r="2.2" fill="currentColor"/></svg>';
var NAV=[['dashboard','Overview'],['transactions','Transactions'],['budgets','Budgets'],['groups','Group splits']];

/* ---------- state ---------- */
var S={user:null,data:null,view:'dashboard',month:ym(today()),q:'',fcat:'all',ftype:'all',editing:null,group:null,authTab:'login',charts:[],lastDel:null,toastTimer:null};

function defaults(){return {currency:'₹',txns:[],budgets:{},groups:[]}}
function saveData(){Store.set('spendora:data:'+S.user.id,S.data)}
function users(){return Store.get('spendora:users')||[]}
function loadUser(u){
  S.user=u;
  S.data=Store.get('spendora:data:'+u.id)||defaults();
  if(!S.data.groups)S.data.groups=[];
  Store.set('spendora:session',u.id);
  S.view='dashboard';S.month=ym(today());S.editing=null;S.group=null;
}
function me(){return S.user.name.trim().split(/\s+/)[0]}

async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  }
  var h=0,s=salt+pw;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}
  return 'f'+h;
}

/* ---------- calculations ---------- */
function monthTx(m){return S.data.txns.filter(function(t){return ym(t.date)===m})}
function catSpend(m,cat){return sum(monthTx(m).filter(function(t){return t.type==='expense'&&t.category===cat}))}
function catColor(c){return CAT_COLORS[c]||'var(--muted)'}

function groupNet(g){
  var net={};g.members.forEach(function(m){net[m]=0});
  g.expenses.forEach(function(e){
    var c=Math.round(e.amount*100),n=e.split.length,base=Math.floor(c/n),rem=c-base*n;
    net[e.paidBy]=(net[e.paidBy]||0)+c;
    e.split.forEach(function(m,i){net[m]=(net[m]||0)-(base+(i<rem?1:0))});
  });
  g.settlements.forEach(function(s){
    var c=Math.round(s.amount*100);
    net[s.from]=(net[s.from]||0)+c;
    net[s.to]=(net[s.to]||0)-c;
  });
  return net;
}
function suggest(net){
  var d=[],c=[],k;
  for(k in net){if(net[k]<0)d.push([k,-net[k]]);else if(net[k]>0)c.push([k,net[k]])}
  d.sort(function(a,b){return b[1]-a[1]});c.sort(function(a,b){return b[1]-a[1]});
  var out=[],i=0,j=0;
  while(i<d.length&&j<c.length){
    var x=Math.min(d[i][1],c[j][1]);
    out.push({from:d[i][0],to:c[j][0],cents:x});
    d[i][1]-=x;c[j][1]-=x;
    if(d[i][1]===0)i++;
    if(c[j][1]===0)j++;
  }
  return out;
}

}

function showErrs(f,errs){
  f.querySelectorAll('[data-err]').forEach(function(el){el.textContent=errs[el.dataset.err]||''});
  return Object.keys(errs).length>0;
}
async function doLogin(f){
  var fd=new FormData(f),email=String(fd.get('email')||'').trim().toLowerCase(),pw=String(fd.get('password')||'');
  var errs={};
  if(!email)errs.email='Enter your email.';
  if(!pw)errs.password='Enter your password.';
  if(showErrs(f,errs))return;
  var u=users().find(function(x){return x.email===email});
  if(!u){showErrs(f,{email:'No account found with that email. Create one first.'});return}
  var h=await hashPw(pw,u.salt);
  if(h!==u.hash){showErrs(f,{password:'That password is not right.'});return}
  loadUser(u);render();
}
async function doSignup(f){
  var fd=new FormData(f),name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase(),pw=String(fd.get('password')||'');
  var errs={};
  if(name.length<2)errs.name='Enter your name (2 characters or more).';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errs.email='Enter a valid email address.';
  else if(users().some(function(x){return x.email===email}))errs.email='An account with this email already exists. Log in instead.';
  if(pw.length<6)errs.password='Use at least 6 characters.';
  if(showErrs(f,errs))return;
  var salt=uid()+uid();
  var u={id:uid(),name:name,email:email,salt:salt,hash:await hashPw(pw,salt)};
  var all=users();all.push(u);Store.set('spendora:users',all);
  loadUser(u);saveData();render();
}

/* ---------- views: dashboard ---------- */
function dashHtml(){
  var m=S.month,tx=monthTx(m);
  var exp=tx.filter(function(t){return t.type==='expense'}),inc=tx.filter(function(t){return t.type==='income'});
  var spent=sum(exp),income=sum(inc),balance=income-spent;
  var cap=0;EXP_CATS.forEach(function(c){cap+=(+S.data.budgets[c]||0)});
  var nowM=ym(today()),isCur=m===nowM,dim=daysIn(m),dayNo=new Date().getDate();
  var frac=m<nowM?1:isCur?dayNo/dim:0;

  var hero;
  if(cap>0){
    var left=cap-spent,used=spent/cap;
    var st=spent>cap?'over':(isCur&&used>frac+0.08)?'warn':'ok';
    var msg;
    if(isCur){
      var proj=frac>0?spent/frac:spent;
      msg=proj>cap
        ?'You have used '+Math.round(used*100)+'% of your budget and the month is '+Math.round(frac*100)+'% done. At this pace you will spend about '+fmt(Math.round(proj))+', which is '+fmt(Math.round(proj-cap))+' over.'
        :'You have used '+Math.round(used*100)+'% of your budget and the month is '+Math.round(frac*100)+'% done. At this pace you will finish around '+fmt(Math.round(proj))+', which is '+fmt(Math.round(cap-proj))+' under budget.';
    }else if(m<nowM){
      msg='You used '+Math.round(used*100)+'% of that month\u2019s budget.';
    }else{
      msg='This month has not started yet.';
    }
    hero='<div class="big num'+(left<0?' over':'')+'">'+(left>=0?fmt(left):fmt(-left))+'</div>'+
      '<p class="sub">'+(left>=0?'left in the '+monthShort(m)+' budget of '+fmt(cap):'over the '+monthShort(m)+' budget of '+fmt(cap))+'</p>'+
      '<div class="pace"><div class="pace-track" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,Math.round(used*100))+'"><div class="pace-fill '+st+'" data-w="'+Math.min(100,used*100)+'%"></div></div>'+
      (isCur?'<div class="pace-mark" style="left:'+(frac*100)+'%"><span>today</span></div>':'')+'</div>'+
      '<p class="pace-msg">'+msg+'</p>';
  }else{
    hero='<h2 style="font-size:1.5rem">Set budgets to see how your month is pacing</h2>'+
      '<div class="empty"><p>Give each category a monthly limit and this panel will show how much is left and whether you are ahead of or behind the calendar.</p>'+
      '<button class="btn primary" data-act="nav" data-v="budgets">Set category budgets</button></div>';
  }

  var alerts=EXP_CATS.map(function(c){
    var lim=+S.data.budgets[c]||0;if(!lim)return '';
    var p=catSpend(m,c)/lim;
    if(p<0.8)return '';
    return '<span class="chip '+(p>1?'over':'warn')+'"><span class="dot" style="background:'+catColor(c)+'"></span>'+esc(c)+' is at '+Math.round(p*100)+'% of its limit</span>';
  }).join('');

  var recent=tx.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)}).slice(0,6);
  var recentHtml=recent.length
    ?'<ul class="list">'+recent.map(function(t){return txRow(t,false)}).join('')+'</ul><div class="listfoot"><span></span><button class="link" data-act="nav" data-v="transactions">See all transactions</button></div>'
    :'<div class="empty"><p>No transactions in '+monthLabel(m)+' yet.</p><button class="btn primary" data-act="nav" data-v="transactions">Add a transaction</button>'+
      (S.data.txns.length===0?' <button class="btn" data-act="demo">Load sample data</button>':'')+'</div>';

  return head('Overview',true)+
    '<section class="panel hero" aria-label="Budget pace">'+hero+'</section>'+
    '<div class="stats panel" style="margin-top:16px"><div><small>Spent</small><b class="num">'+fmt(spent)+'</b></div><div><small>Income</small><b class="num">'+fmt(income)+'</b></div><div><small>Balance</small><b class="num'+(balance<0?' neg':'')+'">'+fmt(balance)+'</b></div></div>'+
    (alerts?'<div class="alerts" aria-label="Budget alerts">'+alerts+'</div>':'')+
    '<div class="two" style="margin-top:16px">'+
      '<section class="panel"><h2>Where it went</h2>'+(spent>0?'<div class="chartbox"><canvas id="cDonut" role="img" aria-label="Spending by category for '+monthLabel(m)+'"></canvas></div>':'<p class="empty">Spending by category appears here once you log an expense.</p>')+'</section>'+
      '<section class="panel"><h2>Last six months</h2>'+(S.data.txns.length?'<div class="chartbox"><canvas id="cBars" role="img" aria-label="Income and spending for the last six months"></canvas></div>':'<p class="empty">Monthly totals appear here once you have a few transactions.</p>')+'</section>'+
    '</div>'+
    '<section class="panel" style="margin-top:16px"><h2>Recent in '+monthShort(m)+'</h2>'+recentHtml+'</section>';

function submitTx(f){
  var fd=new FormData(f),type=fd.get('type'),amount=parseFloat(fd.get('amount')),cat=fd.get('category'),date=fd.get('date'),note=String(fd.get('note')||'').trim();
  var errs={};
  if(!isFinite(amount)||amount<=0)errs.amount='Enter an amount greater than 0.';
  else if(amount>100000000)errs.amount='That amount is too large.';
  if(!cat)errs.category='Choose a category.';
  if(!date)errs.date='Pick a date.';
  if(note.length>80)errs.note='Keep the note under 80 characters.';
  if(showErrs(f,errs))return;
  var amt=Math.round(amount*100)/100,verb;
  if(S.editing){
    var t=S.data.txns.find(function(x){return x.id===S.editing});
    t.type=type;t.amount=amt;t.category=cat;t.date=date;t.note=note;verb='Changes saved';
  }else{
    S.data.txns.push({id:uid(),type:type,amount:amt,category:cat,date:date,note:note});
    verb=type==='income'?'Income added':'Expense added';
  }
  S.editing=null;S.month=ym(date);saveData();render();toast(verb);
}

function budgetBar(cat){
  var lim=+S.data.budgets[cat]||0,sp=catSpend(S.month,cat);
  if(!lim)return '<span class="bl">'+(sp?fmt(sp)+' spent, no limit set':'No limit set')+'</span>';
  var p=sp/lim,st=p>1?'over':p>=0.8?'warn':'ok';
  var label=p>1?fmt(sp-lim)+' over the limit':p>=0.8?fmt(lim-sp)+' left, close to the limit':fmt(lim-sp)+' left';
  return '<div class="bar '+st+'" role="progressbar" aria-label="'+esc(cat)+' budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,Math.round(p*100))+'"><i style="width:'+Math.min(100,p*100)+'%"></i></div>'+
    '<span class="bl '+st+'">'+fmt(sp)+' spent, '+label+'</span>';

function budgetSummary(){

    '<div class="field"><label for="x-date">Date</label><input id="x-date" name="date" type="date" value="'+today()+'"></div></div>'+
    '<fieldset class="field" style="border:0;padding:0;margin:0 0 14px"><legend style="font-weight:600;font-size:.92rem;margin-bottom:6px">Split equally between</legend><div class="checks">'+
    g.members.map(function(m,i){return '<label><input type="checkbox" name="split" value="'+esc(m)+'" checked>'+esc(m)+'</label>'}).join('')+'</div><p class="err" role="alert" data-err="split"></p></fieldset>'+
    '<button class="btn primary" type="submit">Add expense</button></form></section>';

  var bals='<section class="panel"><h2>Who owes whom</h2>'+
    g.members.map(function(m){
      var v=net[m]/100;
      return '<div class="bal"><span>'+esc(m)+'</span><span class="num '+(v>0?'pos':v<0?'neg':'muted')+'">'+(v>0?'is owed '+fmt(v):v<0?'owes '+fmt(-v):'settled')+'</span></div>';
    }).join('')+
    (sug.length?'<h3 style="margin:18px 0 4px;font-size:1rem">Simplest way to settle up</h3>'+sug.map(function(s,i){
      return '<div class="settle"><span><b>'+esc(s.from)+'</b> pays <b>'+esc(s.to)+'</b> <span class="num">'+fmt(s.cents/100)+'</span></span><button class="btn sm" data-act="settle" data-i="'+i+'">Mark as paid</button></div>';
    }).join(''):(g.expenses.length?'<p class="empty" style="margin-top:12px">Everyone is settled up.</p>':''))+
    '</section>';

  var hist=g.expenses.map(function(e){return {kind:'e',date:e.date,id:e.id,e:e}}).concat(g.settlements.map(function(s){return {kind:'s',date:s.date,id:s.id,s:s}}))
    .sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
  var histHtml=hist.length?'<ul class="list">'+hist.map(function(h){
    if(h.kind==='e'){
      var e=h.e,share=e.amount/e.split.length;
      return '<li class="row" style="grid-template-columns:56px minmax(0,1fr) auto auto"><span class="d">'+fmtDate(e.date)+'</span><span class="m"><b>'+esc(e.desc)+'</b><small>'+esc(e.paidBy)+' paid, split '+e.split.length+' ways (about '+fmt(Math.round(share*100)/100)+' each)</small></span><span class="amt">'+fmt(e.amount)+'</span><span class="acts"><button class="link danger" data-act="delexp" data-id="'+e.id+'" aria-label="Delete '+esc(e.desc)+'">Delete</button></span></li>';
    }
    var s=h.s;
    return '<li class="row" style="grid-template-columns:56px minmax(0,1fr) auto auto"><span class="d">'+fmtDate(s.date)+'</span><span class="m"><b>Payment</b><small>'+esc(s.from)+' paid '+esc(s.to)+'</small></span><span class="amt in">'+fmt(s.amount)+'</span><span class="acts"><button class="link danger" data-act="delsettle" data-id="'+s.id+'" aria-label="Delete payment">Delete</button></span></li>';
  }).join('')+'</ul>':'<p class="empty">No expenses yet.</p>';

  return '<section class="panel"><div class="ghead"><div><h2 style="font-size:1.5rem">'+esc(g.name)+'</h2><p class="muted" style="margin-top:4px">'+g.expenses.length+' shared expense'+(g.expenses.length===1?'':'s')+', '+fmt(total)+' in total</p></div>'+
    '<button class="link danger" data-act="delgroup" data-id="'+g.id+'">Delete group</button></div>'+
    '<div class="members">'+g.members.map(function(m){return '<span class="chip">'+esc(m)+'</span>'}).join('')+'</div></section>'+
    bals+form+'<section class="panel"><h2>History</h2>'+histHtml+'</section>';
}
function submitGroup(f){
  var fd=new FormData(f),name=String(fd.get('name')||'').trim();
  var raw=String(fd.get('members')||'').split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
  var seen={},mem=[];
  [me()].concat(raw).forEach(function(n){var k=n.toLowerCase();if(!seen[k]){seen[k]=1;mem.push(n)}});
  var errs={};
  if(!name)errs.name='Give the group a name.';
  if(mem.length<2)errs.members='Add at least one other person.';
  if(mem.length>12)errs.members='Keep groups to 12 people or fewer.';
  if(showErrs(f,errs))return;
  var g={id:uid(),name:name,members:mem,expenses:[],settlements:[]};
  S.data.groups.push(g);S.group=g.id;saveData();render();toast('Group created');
}
function submitGroupExpense(f){
  var g=curGroup();if(!g)return;
  var fd=new FormData(f),desc=String(fd.get('desc')||'').trim(),amount=parseFloat(fd.get('amount')),paidBy=fd.get('paidBy'),date=fd.get('date')||today(),split=fd.getAll('split');
  var errs={};
  if(!desc)errs.desc='Say what the expense was for.';
  if(!isFinite(amount)||amount<=0)errs.amount='Enter an amount greater than 0.';
  if(!split.length)errs.split='Pick at least one person to split with.';
  if(showErrs(f,errs))return;
  g.expenses.push({id:uid(),desc:desc,amount:Math.round(amount*100)/100,paidBy:paidBy,split:split,date:date});
  saveData();render();toast('Expense added');
}

/* ---------- sample data ---------- */
function demoData(){
  var cm=ym(today()),dn=new Date().getDate();
  var tpl=[['Food','Groceries',[900,1400],3],['Food','Lunch with friends',[300,650],9],['Food','Coffee and snacks',[120,260],14],['Food','Dinner out',[500,900],22],['Commute','Metro card top-up',[500,500],5],['Commute','Cab rides',[350,700],17],['Rent','Room rent',[9000,9000],2],['Shopping','Clothes',[900,2200],12],['Bills','Phone recharge',[299,299],6],['Bills','Electricity',[600,1100],20],['Fun','Movie night',[400,800],15],['Health','Pharmacy',[150,500],11],['Education','Online course',[499,1299],8]];
  var seed=7;var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
  var txns=[];
  for(var k=-5;k<=0;k++){
    var m=shiftMonth(cm,k),maxDay=k===0?dn:daysIn(m);
    txns.push({id:uid(),type:'income',amount:25000,category:'Allowance',date:m+'-01',note:'Monthly allowance'});
    tpl.forEach(function(t){
      if(t[3]<=maxDay){txns.push({id:uid(),type:'expense',amount:Math.round(t[2][0]+(t[2][1]-t[2][0])*rnd()),category:t[0],date:m+'-'+pad(t[3]),note:t[1]})}
    });
  }
  S.data.txns=txns;
  S.data.budgets={Food:6000,Commute:2000,Rent:9000,Shopping:2500,Bills:1800,Health:800,Fun:1500,Education:1200};
  var d1=today();
  var people=[me(),'Aarav','Meera','Kabir'];
  S.data.groups=[{id:uid(),name:'Flat 302',members:people,
    expenses:[
      {id:uid(),desc:'Groceries',amount:1840,paidBy:'Aarav',split:people.slice(),date:d1},
      {id:uid(),desc:'Electricity bill',amount:2400,paidBy:me(),split:people.slice(),date:d1},
      {id:uid(),desc:'Movie tickets',amount:1200,paidBy:'Meera',split:[me(),'Meera','Kabir'],date:d1}
    ],settlements:[]}];
  S.group=S.data.groups[0].id;
  saveData();
}

/* ---------- charts ---------- */
function destroyCharts(){S.charts.forEach(function(c){try{c.destroy()}catch(e){}});S.charts=[]}
function drawCharts(){
  if(typeof Chart==='undefined')return;
  var css=getComputedStyle(document.documentElement);
  var v=function(n){return css.getPropertyValue(n).trim()};
  Chart.defaults.font.family="'Figtree',system-ui,sans-serif";
  Chart.defaults.color=v('--muted');
  var tx=monthTx(S.month).filter(function(t){return t.type==='expense'});
  var cats=EXP_CATS.filter(function(c){return tx.some(function(t){return t.category===c})});
  var d=document.getElementById('cDonut');
  if(d&&cats.length){
    S.charts.push(new Chart(d,{type:'doughnut',
      data:{labels:cats,datasets:[{data:cats.map(function(c){return catSpend(S.month,c)}),backgroundColor:cats.map(function(c){return CAT_COLORS[c]}),borderColor:v('--surface'),borderWidth:3}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true}},tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+fmt(c.parsed)}}}}}}));
  }
  var b=document.getElementById('cBars');
  if(b){
    var months=[];for(var i=5;i>=0;i--)months.push(shiftMonth(S.month,-i));
    var by=function(type){return months.map(function(m){return sum(monthTx(m).filter(function(t){return t.type===type}))})};
    S.charts.push(new Chart(b,{type:'bar',
      data:{labels:months.map(monthShort),datasets:[{label:'Spent',data:by('expense'),backgroundColor:v('--brand'),borderRadius:4},{label:'Income',data:by('income'),backgroundColor:v('--accent'),borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:v('--line')},ticks:{callback:function(x){return x>=1000?(x/1000)+'k':x}}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true}},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmt(c.parsed.y)}}}}}}));
  }
}

/* ---------- render ---------- */
function render(){
  destroyCharts();
  if(!S.user){app.innerHTML=authHtml();return}
  app.innerHTML=appHtml();
  if(S.view==='dashboard'){
    drawCharts();
    document.querySelectorAll('[data-w]').forEach(function(el){
      requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=el.dataset.w})});
    });
  }
}
function go(view){S.view=view;S.editing=null;render();var m=document.getElementById('main');if(m)m.focus({preventScroll:true});window.scrollTo(0,0)}

/* ---------- events ---------- */
function csvText(){
  var rows=[['Date','Type','Category','Amount','Note']];
  S.data.txns.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(t){
    rows.push([t.date,t.type,t.category,t.amount,t.note||'']);
  });
  return rows.map(function(r){return r.map(function(c){var s=String(c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')}).join('\n');
}
var actions={
  authtab:function(a){S.authTab=a.dataset.t;render()},
  nav:function(a){go(a.dataset.v)},
  mprev:function(){S.month=shiftMonth(S.month,-1);render()},
  mnext:function(){S.month=shiftMonth(S.month,1);render()},
  logout:function(){Store.set('spendora:session',null);S.user=null;S.data=null;S.authTab='login';render()},
  edit:function(a){
    S.editing=a.dataset.id;render();
    var el=document.getElementById('f-amount');if(el){el.focus();el.scrollIntoView({block:'center'})}
  },
  canceledit:function(){S.editing=null;render()},
  del:function(a){
    var i=S.data.txns.findIndex(function(t){return t.id===a.dataset.id});if(i<0)return;
    S.lastDel={kind:'tx',item:S.data.txns[i],idx:i};
    S.data.txns.splice(i,1);saveData();render();toast('Transaction deleted',true);
  },
  undo:function(){
    var d=S.lastDel;if(!d)return;
    if(d.kind==='tx')S.data.txns.splice(Math.min(d.idx,S.data.txns.length),0,d.item);
    S.lastDel=null;saveData();render();toast('Restored');
  },
  csv:function(){
    openModal('<h2>Export transactions</h2><p class="muted" style="margin:6px 0 12px">Copy this CSV and paste it into a spreadsheet or save it as a .csv file.</p><textarea id="csvbox" readonly aria-label="CSV data">'+esc(csvText())+'</textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" data-act="copycsv">Copy to clipboard</button><button class="btn" data-act="closemodal">Close</button></div>');
  },
  copycsv:function(){
    var box=document.getElementById('csvbox');box.focus();box.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(box.value).then(function(){toast('Copied')},function(){toast('Press Ctrl+C to copy the selected text')});return}
    toast(ok?'Copied':'Press Ctrl+C to copy the selected text');
  },
  closemodal:function(){closeModal()},
  demo:function(){demoData();render();toast('Sample data loaded')},
  opengroup:function(a){S.group=a.dataset.id;render()},
  delgroup:function(a){
    var i=S.data.groups.findIndex(function(g){return g.id===a.dataset.id});if(i<0)return;
    var removed=S.data.groups.splice(i,1)[0];
    S.group=null;saveData();render();
    S.lastDel={kind:'group',item:removed,idx:i};
    var t=document.getElementById('toast');t.innerHTML='<span>Group deleted</span><button data-act="undogroup">Undo</button>';t.classList.add('show');
    clearTimeout(S.toastTimer);S.toastTimer=setTimeout(function(){t.classList.remove('show')},4500);
  },
  undogroup:function(){
    var d=S.lastDel;if(!d||d.kind!=='group')return;
    S.data.groups.splice(Math.min(d.idx,S.data.groups.length),0,d.item);S.group=d.item.id;S.lastDel=null;saveData();render();toast('Restored');
  },
  delexp:function(a){var g=curGroup();if(!g)return;g.expenses=g.expenses.filter(function(e){return e.id!==a.dataset.id});saveData();render();toast('Expense deleted')},
  delsettle:function(a){var g=curGroup();if(!g)return;g.settlements=g.settlements.filter(function(e){return e.id!==a.dataset.id});saveData();render();toast('Payment deleted')},
  settle:function(a){
    var g=curGroup();if(!g)return;
    var s=suggest(groupNet(g))[+a.dataset.i];if(!s)return;
    g.settlements.push({id:uid(),from:s.from,to:s.to,amount:s.cents/100,date:today()});
    saveData();render();toast('Payment recorded');
  }
};
var forms={login:doLogin,signup:doSignup,tx:submitTx,group:submitGroup,gexp:submitGroupExpense};

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a)return;
  if(a.classList.contains('modalbg')&&e.target!==a)return;
  var fn=actions[a.dataset.act];if(fn)fn(a,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var fn=forms[f.dataset.form];if(fn)fn(f);
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var l=document.getElementById('txList');if(l)l.innerHTML=txListHtml()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='type'&&t.closest('form[data-form="tx"]')){
    var sel=document.getElementById('f-cat');if(sel)sel.innerHTML=catOptions(t.value,'');
    return;
  }
  var k=t.dataset&&t.dataset.change;if(!k)return;
  if(k==='currency'){S.data.currency=t.value;saveData();render()}
  else if(k==='fcat'){S.fcat=t.value;var l=document.getElementById('txList');if(l)l.innerHTML=txListHtml()}
  else if(k==='ftype'){S.ftype=t.value;var l2=document.getElementById('txList');if(l2)l2.innerHTML=txListHtml()}
  else if(k==='budget'){
    var cat=t.dataset.cat,val=parseFloat(t.value);
    if(isFinite(val)&&val>0)S.data.budgets[cat]=Math.round(val);else{delete S.data.budgets[cat];t.value=''}
    saveData();
    var bar=document.getElementById('bbar-'+cat);if(bar)bar.innerHTML=budgetBar(cat);
    var bs=document.getElementById('bsum');if(bs)bs.textContent=budgetSummary();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onTheme=function(){if(S.user&&S.view==='dashboard')render()};
  if(mq.addEventListener)mq.addEventListener('change',onTheme);
}

/* ---------- boot ---------- */
(function boot(){
  var sid=Store.get('spendora:session');
  if(sid){var u=users().find(function(x){return x.id===sid});if(u)loadUser(u)}
  render();
})();
})();
</script>
